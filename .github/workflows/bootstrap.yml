name: Sync source

# Copies the project files from a packaged zip (URL in bootstrap/zip-url.txt) into this repository.
# Change the URL in that file to publish a new version of the source.
on:
  push:
    paths:
      - 'bootstrap/zip-url.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and unpack the source zip
        run: |
          URL=$(tr -d '[:space:]' < bootstrap/zip-url.txt)
          echo "Fetching $URL"
          curl -fsSL "$URL" -o /tmp/src.zip
          rm -rf /tmp/src && mkdir /tmp/src && unzip -q /tmp/src.zip -d /tmp/src
          DIR=$(find /tmp/src -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "Unpacked folder: $DIR"
          ls -la "$DIR"
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude 'bootstrap' "$DIR"/ ./

      - name: Commit the synced files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Sync source from zip"
            git push
          fi
