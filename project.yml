# XcodeGen spec: generates AbyssalArcade.xcodeproj (brew install xcodegen, then `xcodegen generate`).
# Before building, change the bundle identifiers and set DEVELOPMENT_TEAM to your Apple developer team ID.
name: AbyssalArcade
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""            # <- your team ID, e.g. ABCDE12345
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  AbyssalArcade:
    type: application
    platform: iOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.abyssalarcade        # <- change
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Abyssal Arcade
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: AbyssalArcadeAU
        embed: true
  AbyssalArcadeAU:
    type: app-extension
    platform: iOS
    sources:
      - Extension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.abyssalarcade.au     # <- must start with the app's identifier
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Abyssal Arcade MIDI
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AudioUnitViewController
          NSExtensionAttributes:
            AudioComponents:
              - name: "Abyssal: Arcade MIDI"
                description: "Physics sequencer that sends MIDI"
                manufacturer: Abys
                subtype: Arcd
                type: aumi
                version: 1
                sandboxSafe: true
                tags:
                  - MIDI
  ArcadeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Tests/ArcadeTests
      - Extension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.abyssalarcade.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ArcadeTests:
    build:
      targets:
        ArcadeTests: all
    test:
      targets:
        - ArcadeTests
